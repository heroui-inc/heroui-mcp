name: Component Data Extraction Pipeline (Native MCP)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/native-mcp/scripts/**'
      - 'apps/native-mcp/src/**'
      - '.github/workflows/extraction-pipeline-native.yml'
  repository_dispatch:
    types: [native-docs-deployed]
  workflow_dispatch:

jobs:
  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      bucket-name: ${{ steps.set-env.outputs.bucket-name }}
    steps:
      - name: Determine environment from Vercel deployment
        id: set-env
        run: |
          ENV="${{ github.event.client_payload.environment }}"
          
          if [[ -z "$ENV" ]]; then
            echo "❌ Error: No environment in deployment payload. Extraction requires Vercel deployment."
            exit 1
          fi
          
          if [[ "$ENV" == "production" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data" >> $GITHUB_OUTPUT
          elif [[ "$ENV" == "preview" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data-staging" >> $GITHUB_OUTPUT
          else
            echo "❌ Error: Unknown environment: $ENV"
            echo "Expected: 'production' or 'preview'"
            exit 1
          fi

  extract:
    name: Extract HeroUI Native Data
    runs-on: ubuntu-latest
    needs: set-environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/install

      - name: Extract HeroUI Native data
        working-directory: apps/native-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ needs.set-environment.outputs.bucket-name }}
        run: |
          ./scripts/extract.sh "${{ needs.set-environment.outputs.environment }}" both
