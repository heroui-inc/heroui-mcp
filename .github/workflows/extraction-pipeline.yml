name: Component Data Extraction Pipeline (React MCP)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/react-mcp/scripts/**'
      - 'apps/react-mcp/src/**'
      - '.github/workflows/extraction-pipeline.yml'
  repository_dispatch:
    types: [react-version-bump]
  workflow_dispatch:

jobs:
  dispatch-branches:
    name: Trigger Extraction on Main and Develop
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Trigger workflow on main branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'extraction-pipeline.yml',
              ref: 'main',
            });

      - name: Trigger workflow on develop branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'extraction-pipeline.yml',
              ref: 'develop',
            });

  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      bucket-name: ${{ steps.set-env.outputs.bucket-name }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data-staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data-dev" >> $GITHUB_OUTPUT
          fi

  extract:
    name: Extract HeroUI Data (React MCP)
    runs-on: ubuntu-latest
    needs: set-environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/install

      - name: Extract HeroUI data
        working-directory: apps/react-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ needs.set-environment.outputs.bucket-name }}
        run: |
          ./scripts/extract.sh "${{ needs.set-environment.outputs.environment }}" both
