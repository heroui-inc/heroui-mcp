name: Component Data Extraction Pipeline

on:
  push:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      library:
        description: "Library to extract (all, components, theme, heroui)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - components
          - theme
          - heroui
      force:
        description: "Force re-extraction even if version exists"
        required: false
        default: false
        type: boolean
      version:
        description: "Specific version to extract (optional)"
        required: false

jobs:
  # Determine environment based on branch
  set-environment:
    name: Set Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      bucket-name: ${{ steps.set-env.outputs.bucket-name }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data-staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "bucket-name=heroui-mcp-data-dev" >> $GITHUB_OUTPUT
          fi
          echo "🎯 Environment: $(cat $GITHUB_OUTPUT | grep environment | cut -d'=' -f2)"
          echo "🪣 Bucket: $(cat $GITHUB_OUTPUT | grep bucket-name | cut -d'=' -f2)"

  check-versions:
    name: Check for New Versions
    runs-on: ubuntu-latest
    needs: set-environment
    outputs:
      heroui-needs-update: ${{ steps.check.outputs.heroui-needs-update }}
      theme-needs-update: ${{ steps.check.outputs.theme-needs-update }}
      heroui-version: ${{ steps.check.outputs.heroui-version }}
      theme-version: ${{ steps.check.outputs.theme-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies for version check
        run: pnpm install @aws-sdk/client-s3

      - name: Check for new versions
        id: check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ needs.set-environment.outputs.bucket-name }}
        run: |
          node scripts/check-versions-ci.mjs \
            --force=${{ inputs.force }} \
            --library=${{ inputs.library || 'all' }} \
            --version=${{ inputs.version }}

  extract-heroui:
    name: Extract HeroUI Components
    runs-on: ubuntu-latest
    needs: [set-environment, check-versions]
    if: needs.check-versions.outputs.heroui-needs-update == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: |
          pnpm install @aws-sdk/client-s3
          pnpm install tsx

      - name: Extract HeroUI components
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          FLAGS=""

          if [ "${{ inputs.force }}" == "true" ]; then
            FLAGS="--force"
          fi

          # Only add version flag if we have a valid version string
          if [ -n "${{ inputs.version }}" ]; then
            FLAGS="$FLAGS --version=${{ inputs.version }}"
          elif [ -n "${{ needs.check-versions.outputs.heroui-version }}" ] && [ "${{ needs.check-versions.outputs.heroui-version }}" != "" ]; then
            FLAGS="$FLAGS --version=${{ needs.check-versions.outputs.heroui-version }}"
          fi

          ./scripts/extract.sh "$ENV" heroui $FLAGS

      - name: Notify success
        if: success()
        run: |
          echo "✅ Successfully extracted HeroUI components version ${{ needs.check-versions.outputs.heroui-version }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Failed to extract HeroUI components"

  extract-theme:
    name: Extract HeroUI Theme System
    runs-on: ubuntu-latest
    needs: [set-environment, check-versions]
    if: needs.check-versions.outputs.theme-needs-update == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Install dependencies
        run: |
          pnpm install @aws-sdk/client-s3
          pnpm install tsx

      - name: Extract HeroUI theme system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          FLAGS=""

          if [ "${{ inputs.force }}" == "true" ]; then
            FLAGS="--force"
          fi

          # Only add version flag if we have a valid version string
          if [ -n "${{ inputs.version }}" ]; then
            FLAGS="$FLAGS --version=${{ inputs.version }}"
          elif [ -n "${{ needs.check-versions.outputs.theme-version }}" ] && [ "${{ needs.check-versions.outputs.theme-version }}" != "" ]; then
            FLAGS="$FLAGS --version=${{ needs.check-versions.outputs.theme-version }}"
          fi

          ./scripts/extract.sh "$ENV" theme $FLAGS

      - name: Notify success
        if: success()
        run: |
          echo "✅ Successfully extracted HeroUI theme system version ${{ needs.check-versions.outputs.theme-version }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Failed to extract HeroUI theme system"

  summary:
    name: Extraction Summary
    runs-on: ubuntu-latest
    needs: [set-environment, check-versions, extract-heroui, extract-theme]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Component Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ needs.set-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**R2 Bucket**: ${{ needs.set-environment.outputs.bucket-name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.check-versions.outputs.heroui-needs-update }}" == "true" ]; then
            if [ "${{ needs.extract-heroui.result }}" == "success" ]; then
              echo "✅ **HeroUI**: Successfully extracted version ${{ needs.check-versions.outputs.heroui-version }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **HeroUI**: Failed to extract version ${{ needs.check-versions.outputs.heroui-version }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ **HeroUI**: No update needed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.check-versions.outputs.theme-needs-update }}" == "true" ]; then
            if [ "${{ needs.extract-theme.result }}" == "success" ]; then
              echo "✅ **HeroUI Theme**: Successfully extracted version ${{ needs.check-versions.outputs.theme-version }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **HeroUI Theme**: Failed to extract version ${{ needs.check-versions.outputs.theme-version }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ **HeroUI Theme**: No update needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Force extraction**: ${{ inputs.force }}" >> $GITHUB_STEP_SUMMARY
            echo "**Target library**: ${{ inputs.library }}" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ inputs.version }}" ]; then
              echo "**Specific version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
            fi
          fi
