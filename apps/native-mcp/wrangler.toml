name = "heroui-native-mcp-api"

# ------------------------------------------------------------
# -- General
# ------------------------------------------------------------
main = "src/api.ts"
compatibility_date = "2025-01-18"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
# -- Test Environment
# ------------------------------------------------------------
[env.test]
# Test environment configuration for Vitest

[[env.test.r2_buckets]]
binding = 'R2'
bucket_name = 'heroui-mcp-data-dev'

[env.test.vars]
NODE_ENV = "test"
R2_BUCKET_NAME = "heroui-mcp-data-dev"

# ------------------------------------------------------------
# -- Development Environment
# ------------------------------------------------------------
[env.development]
# Local development configuration

[[env.development.r2_buckets]]
binding = 'R2'
bucket_name = 'heroui-mcp-data-dev'

[env.development.vars]
NODE_ENV = "development"
POSTHOG_HOST = "https://us.i.posthog.com"
R2_BUCKET_NAME = "heroui-mcp-data-dev"

[[env.development.services]]
binding = "PLATFORM_API"
service = "heroui-native-mcp-api-development"

# ------------------------------------------------------------
# -- Staging Environment
# ------------------------------------------------------------
[env.staging]
routes = [
  { pattern = "staging-native-mcp-api.heroui.com", custom_domain = true }
]

[[env.staging.r2_buckets]]
binding = 'R2'
bucket_name = 'heroui-mcp-data-staging'

[env.staging.vars]
NODE_ENV = "staging"
POSTHOG_HOST = "https://us.i.posthog.com"
R2_BUCKET_NAME = "heroui-mcp-data-staging"

[[env.staging.services]]
binding = "PLATFORM_API"
service = "heroui-native-mcp-api-staging"

# ------------------------------------------------------------
# -- Production Environment
# ------------------------------------------------------------
[env.production]
routes = [
  { pattern = "native-mcp-api.heroui.com", custom_domain = true }
]

[[env.production.r2_buckets]]
binding = 'R2'
bucket_name = 'heroui-mcp-data'

[env.production.vars]
NODE_ENV = "production"
POSTHOG_HOST = "https://us.i.posthog.com"
R2_BUCKET_NAME = "heroui-mcp-data"

[[env.production.services]]
binding = "PLATFORM_API"
service = "heroui-native-mcp-api-production"

# ------------------------------------------------------------
# -- Worker Settings
# ------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

[limits]
# 60 second timeout for MCP operations
cpu_ms = 60000