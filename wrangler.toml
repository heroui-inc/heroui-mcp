name = "heroui-mcp-api"

# ------------------------------------------------------------
# -- General
# ------------------------------------------------------------
main = "src/api.ts"
compatibility_date = "2025-01-18"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
# -- Development Environment
# ------------------------------------------------------------
[env.development]
# Local development configuration

[[env.development.r2_buckets]]
binding = 'COMPONENT_DATA'
bucket_name = 'heroui-mcp-data-dev'

[env.development.vars]
APP_ENV = "development"
LOG_LEVEL = "debug"
# Analytics configuration - disabled in development
POSTHOG_KEY = ""
POSTHOG_HOST = ""

# ------------------------------------------------------------
# -- Staging Environment
# ------------------------------------------------------------
[env.staging]
routes = [
  { pattern = "staging-mcp-api.heroui.com", custom_domain = true }
]

[[env.staging.r2_buckets]]
binding = 'COMPONENT_DATA'
bucket_name = 'heroui-mcp-data-staging'

[env.staging.vars]
APP_ENV = "staging"
LOG_LEVEL = "info"
# Analytics configuration - disabled in staging for now
POSTHOG_KEY = ""
POSTHOG_HOST = ""
BUCKET_NAME = "heroui-mcp-data-staging"

# ------------------------------------------------------------
# -- Production Environment
# ------------------------------------------------------------
[env.production]
routes = [
  { pattern = "mcp-api.heroui.com", custom_domain = true }
]

[[env.production.r2_buckets]]
binding = 'COMPONENT_DATA'
bucket_name = 'heroui-mcp-data'

[env.production.vars]
APP_ENV = "production"
LOG_LEVEL = "warn"
# Analytics configuration - enabled in production
POSTHOG_KEY = "phc_VrhZEcKbs1xMxKoRtnvB8vxY8FwBApG8Pk87aOqvfLt"
POSTHOG_HOST = "https://us.i.posthog.com"
BUCKET_NAME = "heroui-mcp-data"

# ------------------------------------------------------------
# -- Worker Settings
# ------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

[limits]
# 60 second timeout for MCP operations
cpu_ms = 60000